<!doctype html>
<html lang="ru" style="background-color:#ff6821">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Автомат · Пусть повезёт</title>
  <link rel="icon" href="data:,">
  <link rel="modulepreload" href="screen.js?v=9">
  <link rel="modulepreload" href="sound.js?v=9">
  <link rel="modulepreload" href="sound-map.js?v=5">
  <link rel="stylesheet" href="../raffle-light-v14/styles.css?v=10">
  <link rel="stylesheet" href="capsule.css?v=10">
  <link rel="preload" href="assets/vending-machine.svg" as="fetch" crossorigin>
  <link rel="modulepreload" href="outcomes.js?v=11">
  <script src="capsule.js?v=20" type="module"></script>
  <script src="../raffle-light-v14/press.js?v=3" defer></script>
</head>
<body>
  <div class="screen capsule-screen">
    <div class="vending-rays" aria-hidden="true"><span></span><span></span></div>
    <header class="header">
      <a class="home-link" href="./" aria-label="На первый экран"><img class="partners" src="assets/partners.svg" alt="Авиасейлс × modi" width="257" height="35"></a>
    </header>
    <main class="capsule-stage" data-phase="loading" aria-busy="true">
      <form class="capsule-form" action="./" method="get">
        <input type="hidden" name="view" value="prediction">
        <input type="hidden" name="state" value="open" disabled>
        <input type="hidden" name="prize" disabled>
        <div class="vending-controls">
          <p class="vending-status" role="status"></p>
          <button class="arcade-button vending-trigger" type="button" disabled>Крутить</button>
        </div>
        <div class="vending-frame">
          <div class="vending-machine">
            <div class="vending-art"></div>
            <button class="vending-dial" type="button" aria-label="Повернуть ручку автомата" disabled></button>
            <div class="vending-outlet" hidden aria-hidden="true"><img src="assets/closed-capsule.svg" width="440" height="440" alt=""></div>
          </div>
        </div>
        <button class="capsule-action" type="submit" aria-label="Открыть капсулу" hidden disabled>
          <span class="capsule-roll">
            <img class="capsule-art" src="assets/closed-capsule.svg" alt="" width="440" height="440" fetchpriority="high">
            <span class="capsule-shell capsule-shell-top"></span>
            <span class="capsule-shell capsule-shell-bottom"></span>
          </span>
          <span class="capsule-label" aria-hidden="true">Открыть капсулу</span>
        </button>
      </form>
      <noscript>Чтобы запустить автомат, включи JavaScript.</noscript>
    </main>
    <footer class="footer">
      <a href="./"><span aria-hidden="true">←</span> На главную</a>
    </footer>
  </div>
</body>
</html>
