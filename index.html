<!doctype html>
<html lang="ru" style="background-color:#b1dafa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Пусть повезёт — игра с капсулами и предсказаниями, концепт для портфолио.">
  <title>Пусть повезёт</title>
  <link rel="icon" href="data:,">
  <link rel="modulepreload" href="play/sound.js?v=11">
  <link rel="modulepreload" href="play/sound-map.js?v=6">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    .screen-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 1; background: transparent; }
    .screen-frame[data-waiting] { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: no-preference) {
      .screen-frame { transition: opacity 260ms cubic-bezier(.22,1,.36,1); }
    }
    .safe-area {
      position: fixed;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  </style>
  <script src="play/shell.js?v=11" type="module"></script>
</head>
<body>
  <div class="safe-area" aria-hidden="true"></div>
  <noscript><a href="play/">Открыть игру</a></noscript>
  <script>
    // The first screen starts loading at once; shell.js takes it over when it arrives.
    window.pustPovezyotBoot = true;
    (function () {
      var allowed = /^(play|raffle-light-v14)\//;
      var route = location.hash.indexOf('#/') === 0 ? location.hash.slice(2) : '';
      var open = new URLSearchParams(location.search).get('state') === 'open';
      if (!allowed.test(route) || /[\\:]|\.\./.test(route.split('?')[0])) route = open ? 'play/?state=open' : 'play/';
      var frame = document.createElement('iframe');
      frame.className = 'screen-frame';
      frame.title = 'Пусть повезёт';
      frame.allow = 'autoplay';
      frame.setAttribute('data-waiting', '');
      frame.setAttribute('data-route', route);
      frame.src = route;
      document.body.appendChild(frame);
    })();
  </script>
</body>
</html>
